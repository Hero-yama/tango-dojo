<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10141D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語道場">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}</style>
<title>準1級 単語道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a phone app; home = deadline + stamp card, quiz = one card at a time */
:root{
  --bg:#EDF0F5; --paper:#FFFFFF; --ink:#1B2440; --muted:#5D6785; --line:#D3D9E6;
  --stamp:#D4333B; --stamp-soft:#F8DEE0; --ice:#2F6FC9; --ice-soft:#DCE8F8;
  --ok:#1E8556; --ok-soft:#DAF1E6; --warn:#B8741F;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141D; --paper:#1A2030; --ink:#E7EBF5; --muted:#98A1BC; --line:#2C3447;
  --stamp:#F0575E; --stamp-soft:#3A2128; --ice:#6FA3F0; --ice-soft:#1E2C45;
  --ok:#45C38B; --ok-soft:#173327; --warn:#E3A754; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141D; --paper:#1A2030; --ink:#E7EBF5; --muted:#98A1BC; --line:#2C3447;
  --stamp:#F0575E; --stamp-soft:#3A2128; --ice:#6FA3F0; --ice-soft:#1E2C45;
  --ok:#45C38B; --ok-soft:#173327; --warn:#E3A754; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:460px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px}
h1,h2{margin:0;text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);letter-spacing:.12em;font-weight:500}
.rank{font-size:12px;text-align:right;color:var(--muted)}
.rank b{display:block;color:var(--ink);font-size:14px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
/* deadline */
.deadline{position:relative;overflow:hidden}
.deadline .msg{font-weight:700;font-size:17px;margin:6px 0 2px}
.clock{font-family:var(--f-mono);font-weight:600;font-size:44px;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.deadline.urgent{border-color:var(--stamp)}
.deadline.urgent .clock{color:var(--stamp);animation:pulse 1s steps(2) infinite}
.deadline.cleared .clock{color:var(--muted);font-size:28px}
@keyframes pulse{50%{opacity:.55}}
.streakrow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.chip{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--bg);font-size:13px}
.chip b{font-family:var(--f-display);font-size:18px;font-weight:400}
.chip.hot b{color:var(--stamp)} .chip.ice b{color:var(--ice)}
.risk{margin-top:12px;font-size:13px;color:var(--stamp);font-weight:700}
/* quota */
.quota{display:flex;align-items:center;gap:16px}
.ring{flex:none;width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .bgc{stroke:var(--line)} .ring .fg{stroke:var(--stamp);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--f-display);font-size:20px}
.quota .txt{min-width:0;flex:1}
.quota .txt p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{appearance:none;border:0;border-radius:12px;padding:16px;font:700 17px var(--f-body);cursor:pointer;width:100%;
  background:var(--stamp);color:#fff;letter-spacing:.04em}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;padding:12px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
/* stamp card */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.cell{aspect-ratio:1;max-width:100%;border:1px dashed var(--line);border-radius:50%;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;color:var(--muted);position:relative}
.cell.done{border:2px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-size:15px;transform:rotate(-12deg);background:var(--stamp-soft)}
.cell.frozen{border:2px solid var(--ice);color:var(--ice);font-family:var(--f-display);font-size:15px;background:var(--ice-soft)}
.cell.today{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.legend .l1::before{background:var(--stamp)} .legend .l2::before{background:var(--ice)} .legend .l3::before{border:1px dashed var(--muted)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{min-width:0}
.stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:400;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.exam{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exam input{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.exam .days{font-family:var(--f-display);font-size:26px}
.notice{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px;font-weight:500}
/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1;margin:0;height:8px}
.qhead .bar i{background:var(--stamp);transition:width .3s}
.qhead .cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.x{appearance:none;background:none;border:0;color:var(--muted);font-size:14px;cursor:pointer;padding:4px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px 18px;text-align:center;position:relative;min-height:170px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.card .pos{font-size:12px;color:var(--muted);letter-spacing:.1em}
.card .word{font-family:var(--f-display);font-size:34px;line-height:1.25;overflow-wrap:anywhere}
.card .word.jp{font-size:26px}
.card .hint{font-size:13px;color:var(--muted)}
.card .tag{position:absolute;top:12px;left:14px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ice)}
.card .tag.new{color:var(--warn)}
.combo{position:absolute;top:10px;right:14px;font-family:var(--f-display);color:var(--stamp);font-size:15px}
.combo.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.5)}}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;background:var(--paper);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;
  font:500 16px var(--f-body);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt .k{font-family:var(--f-mono);font-size:12px;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--stamp);background:var(--stamp-soft)}
.opt:disabled{cursor:default}
.fb{min-height:24px;text-align:center;font-weight:700;font-size:14px}
.fb.ok{color:var(--ok)} .fb.ng{color:var(--stamp)}
/* result */
.result{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.hanko{width:150px;height:150px;border:6px solid var(--stamp);border-radius:50%;display:grid;place-items:center;color:var(--stamp);
  font-family:var(--f-display);font-size:64px;transform:rotate(-14deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both;background:var(--stamp-soft)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}100%{transform:scale(1) rotate(-14deg);opacity:1}}
.result .big{font-family:var(--f-display);font-size:22px}
.result .stats{width:100%}
.confirm{display:flex;gap:8px}
.confirm .btn{font-size:14px;padding:12px}
.foot{font-size:12px;color:var(--muted);text-align:center}
/* coach mascot */
.coach{display:flex;align-items:flex-end;gap:10px}
.coach svg{flex:none;width:88px;height:88px;overflow:visible}
.coach.sm svg{width:62px;height:62px}
.bubble{position:relative;background:var(--paper);border:1.5px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;margin-bottom:22px;min-width:0;text-align:left}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;width:11px;height:11px;background:var(--paper);border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.hop{animation:hop .55s}
@keyframes hop{30%{transform:translateY(-12px)}60%{transform:translateY(0)}80%{transform:translateY(-3px)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mascot{cursor:pointer;-webkit-tap-highlight-color:transparent}
.mascot .m-all,.mascot .m-eyes,.mascot .m-look,.mascot .m-hl,.mascot .m-hr,.mascot .m-spark,.mascot .m-sweat,.mascot .m-tear,.mascot .m-shadow,.mascot .m-blush,.mascot .m-zip{transform-box:fill-box;transform-origin:center}
.mascot .m-all{transform-origin:50% 100%}
.mascot .m-d2{animation-delay:.35s!important}.mascot .m-d3{animation-delay:.7s!important}
.mascot .m-eyes{animation:m-blink 4.2s infinite}
@keyframes m-blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}96%{transform:scaleY(1)}}
.mood-normal .m-all{animation:m-breathe 2.6s ease-in-out infinite}
@keyframes m-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.035,.965)}}
.mood-normal .m-look{animation:m-look 7s ease-in-out infinite}
@keyframes m-look{0%,30%,100%{transform:translateX(0)}36%,50%{transform:translateX(-2px)}56%,72%{transform:translateX(2px)}}
.mood-normal .m-hl{animation:m-wigL 2.6s ease-in-out infinite}.mood-normal .m-hr{animation:m-wigR 2.6s ease-in-out infinite}
@keyframes m-wigL{50%{transform:translate(-1px,-1.5px) rotate(-14deg)}}@keyframes m-wigR{50%{transform:translate(1px,-1.5px) rotate(14deg)}}
.mood-happy .m-all{animation:m-jump .9s cubic-bezier(.3,0,.3,1) infinite}
@keyframes m-jump{0%,100%{transform:translateY(0) scale(1.07,.93)}15%{transform:translateY(0) scale(.95,1.06)}45%{transform:translateY(-12px) scale(.98,1.03)}75%{transform:translateY(0) scale(1.08,.92)}85%{transform:translateY(0) scale(1,1)}}
.mood-happy .m-shadow{animation:m-shadow .9s cubic-bezier(.3,0,.3,1) infinite}
@keyframes m-shadow{45%{transform:scale(.65);opacity:.05}}
.mood-happy .m-hl{transform-origin:100% 100%;animation:m-waveL .4s ease-in-out infinite alternate}
.mood-happy .m-hr{transform-origin:0% 100%;animation:m-waveR .4s ease-in-out infinite alternate}
@keyframes m-waveL{from{transform:rotate(-18deg)}to{transform:rotate(12deg)}}@keyframes m-waveR{from{transform:rotate(18deg)}to{transform:rotate(-12deg)}}
.mascot .m-spark{animation:m-twinkle 1.1s ease-in-out infinite}
@keyframes m-twinkle{0%,100%{transform:scale(.5) rotate(0);opacity:.4}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
.mood-happy .m-blush{animation:m-blush .9s ease-in-out infinite}
@keyframes m-blush{50%{transform:scale(1.3);opacity:1}}
.mood-sad .m-all{animation:m-droop 3.2s ease-in-out infinite}
@keyframes m-droop{0%,100%{transform:rotate(-3deg) scale(1,.98)}50%{transform:rotate(3deg) scale(1.02,.95)}}
.mascot .m-tear{animation:m-tear 1.5s ease-in infinite}
@keyframes m-tear{0%{transform:translateY(-2px);opacity:0}30%{opacity:1}100%{transform:translateY(7px);opacity:0}}
.mood-panic .m-all{animation:m-jitter .16s linear infinite}
@keyframes m-jitter{0%,100%{transform:translate(-1.5px,0) rotate(-2deg)}50%{transform:translate(1.5px,-1px) rotate(2deg)}}
.mood-panic .m-hl{animation:m-flail .2s linear infinite alternate}.mood-panic .m-hr{animation:m-flail .2s linear infinite alternate-reverse}
@keyframes m-flail{from{transform:translateY(-3px) rotate(-25deg)}to{transform:translateY(1px) rotate(20deg)}}
.mascot .m-sweat{animation:m-sweat 1s ease-in infinite}
@keyframes m-sweat{0%{transform:translateY(-2px);opacity:0}20%{opacity:1}100%{transform:translateY(12px);opacity:0}}
.mascot .m-zip{animation:m-zip .3s steps(2) infinite}
@keyframes m-zip{50%{opacity:.2}}
.mascot.poke .m-all{animation:m-poke .55s cubic-bezier(.3,1.5,.5,1)!important}
@keyframes m-poke{0%{transform:scale(1)}25%{transform:scale(1.18,.78)}55%{transform:translateY(-8px) scale(.9,1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v2 追加分 ===== */
.app.hasTab{padding-bottom:100px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;width:100%;max-width:460px}
.tabbar button{flex:1;appearance:none;background:none;border:0;padding:10px 0 12px;font:700 12px var(--f-body);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;letter-spacing:.06em}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--stamp)}
.tabbar button:focus-visible{outline:3px solid var(--ice);outline-offset:-3px}
.btn.alt{background:var(--ink);color:var(--bg)}
.btn.sub{background:var(--ice-soft);color:var(--ice);border:1px solid var(--ice)}
.btn small{font-weight:500;opacity:.85;margin-left:6px}
mark{background:var(--stamp-soft);color:var(--stamp);border-radius:4px;padding:0 3px;font-weight:700}
/* 発音ボタン */
.spk{appearance:none;border:1.5px solid var(--line);background:var(--paper);color:var(--ice);border-radius:50%;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.spk:hover{border-color:var(--ice)}
.spk.big{width:84px;height:84px;margin:6px auto;background:var(--ice-soft);border-color:var(--ice)}
.spk.big svg{width:40px;height:40px}
/* 答え合わせ */
.rv{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--ice);border-radius:12px;padding:12px 14px;text-align:left}
.rv-h{display:flex;align-items:center;gap:10px}
.rv-h b{font-family:var(--f-display);font-weight:400;font-size:22px;overflow-wrap:anywhere}
.rv-h .ps{font-size:11px;color:var(--muted);letter-spacing:.08em;flex:1}
.rv-jp{font-weight:700;margin:2px 0 6px}
.rv-ex{font-size:14px;color:var(--muted);line-height:1.6;font-family:Georgia,"Times New Roman",serif;font-style:italic}
/* 新出語の導入カード */
.intro{gap:10px;padding:26px 18px}
.intro .jpbig{font-size:22px;font-weight:700}
.intro .rv-ex{text-align:left;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:6px}
/* スペル問題 */
.spellbox{display:flex;gap:8px}
.spellbox input{flex:1;min-width:0;font:600 20px var(--f-mono);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink);letter-spacing:.04em}
.spellbox .btn{width:auto;padding:0 20px;font-size:15px}
.pattern{font-family:var(--f-mono);font-size:18px;letter-spacing:.2em;color:var(--muted)}
.dk{margin-top:-2px}
/* 単語帳 */
.search{width:100%;font:500 15px var(--f-body);padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);font:700 12px var(--f-body);padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;margin-bottom:8px}
.wi-h{display:flex;align-items:center;gap:10px}
.wi-h b{font-weight:700;font-size:16px}
.wi-h .jp{color:var(--muted);font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .dot{width:10px;height:10px;border-radius:50%;flex:none;border:1.5px dashed var(--muted)}
.wi.learn .dot{background:var(--ice);border:0}.wi.mas .dot{background:var(--ok);border:0}.wi.weak .dot{background:var(--stamp);border:0}
.wi .rv{margin-top:10px;background:var(--bg)}
.star{appearance:none;background:none;border:0;font-size:20px;color:var(--line);cursor:pointer;padding:0 2px;line-height:1}
.star.on{color:#E8A41C}
.empty{text-align:center;color:var(--muted);padding:30px 0}
/* 週間グラフ */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:96px;margin-top:10px}
.wkc{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;font-size:11px;color:var(--muted)}
.wkc i{display:block;width:100%;max-width:28px;background:var(--ice);border-radius:5px 5px 0 0;min-height:3px;opacity:.85}
.wkc.t i{background:var(--stamp)}
.wkc span{font-family:var(--f-mono);margin-bottom:2px;font-size:11px}
.wkc em{font-style:normal;margin-top:3px}
/* 設定 */
.setlist .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.setlist .row:last-child{border-bottom:0}
.setlist small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.setlist select,.setlist input[type=date]{font:500 14px var(--f-body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sw{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(18px)}
.sw:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.panel p{margin:6px 0 12px;font-size:13px;color:var(--muted)}
.misslist{width:100%;text-align:left;font-size:13px;color:var(--muted)}
.misslist b{color:var(--ink)}
.fm{display:grid;gap:8px;margin-top:12px}
.fm input,.fm select,.fm textarea{font:500 15px var(--f-body);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.fm textarea{font-family:var(--f-mono);font-size:13px;resize:vertical}
.bdg{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;flex:none}

  const old=el.querySelector(".mascot");if(!old)return;
  if(!el._base)el._base=(old.getAttribute("class").match(/mood-(\w+)/)||[])[1]||"normal";

  if(c>=12){pool="poke3";setMood(co,"sleepy",2800)}else if(c>=6){pool="poke2";setMood(co,"happy",2200)}

    p.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${cs[i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d-40}px;--r:${Math.random()*540}deg`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),1300)}

function homeMood(d,doneN,hrsLeft){
  const h=new Date().getHours(),ex=S.exam?diffDays(T,S.exam):null;
  if(d.done){
    if(MILE.includes(S.streak)&&S.lastDone===T)return{mood:"wow",line:fmt(pick(LINES.milestone),{n:S.streak}),cls:"hop"};
    return{mood:"happy",line:pick(LINES.done),cls:"hop"}}
  if(S.notice&&S.notice.includes("途切れ"))return{mood:"sad",line:pick(LINES.broken),cls:""};
  if(ex===0)return{mood:"wow",line:pick(LINES.examday),cls:"hop"};
  if(hrsLeft<=2)return{mood:"panic",line:pick(LINES.panic),cls:"panic"};
  if(hrsLeft<=6)return{mood:"sad",line:pick(LINES.late),cls:"idle"};
  if(h<5)return{mood:"sleepy",line:pick(LINES.midnight),cls:"idle"};
  if(doneN>0)return{mood:"normal",line:pick(LINES.mid),cls:"idle"};
  if(!Object.keys(S.cards).length&&!S.xp)return{mood:"happy",line:pick(LINES.hello),cls:"hop"};
  if(ex!==null&&ex>0&&ex<=30&&Math.random()<(ex<=7?.6:.3))return{mood:"normal",line:fmt(pick(LINES.exam),{d:ex}),cls:"idle"};
  if(Math.random()<.04)return{mood:"happy",line:pick(LINES.rare),cls:"idle"};
  if(Math.random()<.5){const k=h<10?"morning":h<17?"day":"eve";return{mood:h<10?"happy":"normal",line:pick(LINES[k]),cls:"idle"}}
  return{mood:"normal",line:pick(LINES.idle),cls:"idle"};
}
function askLine(type){
  const d=sess,total=d.queue.length,done=total-d.remaining.length;
  if(d.remaining.length===1&&total>=3)return pick(LINES.lastq);
  if(total>=6&&done===Math.floor(total/2))return pick(LINES.half);
  if(kindNow==="weak"&&Math.random()<.5)return pick(LINES.weakask);
  if(type==="listen")return pick(LINES.listen);
  if(type==="spell")return pick(LINES.spellask);

}

function finCoach(acc,n,up,bonus,first){
  let m="happy",l;finWow=true;

/* 組み込み語 + ユーザー追加語(S.custom)から WORDS / WMAP を作り直す */
function rebuild(){
  WORDS.length=0;BASE.forEach(w=>WORDS.push(w));
  for(const k in WMAP)delete WMAP[k];
  (S.custom||[]).forEach(c=>{WORDS.push([c.en,c.pos,c.jp,c.pri||2]);if(c.ex)EX[c.en]=c.ex;else delete EX[c.en]});
  WORDS.forEach((w,i)=>{WMAP[w[0]]={en:w[0],pos:w[1],jp:w[2],pri:w[3]||2,custom:i>=BASE.length}});
}
const POSMAP={"動":"動","形":"形","名":"名","副":"副","他":"他",v:"動",verb:"動",adj:"形",n:"名",noun:"名",adv:"副"};
function addWords(list){
  const res={ok:0,dup:0,bad:0,full:0};S.custom=S.custom||[];
  for(const x of list){
    const en=String(x.en||"").trim().toLowerCase(),jp=String(x.jp||"").trim();
    if(WORDS.length+res.ok>=MAXW){res.full++;continue}
    if(!/^[a-z][a-z -]{0,39}$/.test(en)||!jp){res.bad++;continue}
    if(WMAP[en]||S.custom.some(c=>c.en===en)){res.dup++;continue}
    S.custom.push({en,pos:POS[x.pos]?x.pos:"他",jp:jp.slice(0,80),ex:String(x.ex||"").trim().slice(0,200),pri:[1,2,3].includes(x.pri)?x.pri:2});
    res.ok++;
  }
  rebuild();save();return res;
}
function delWord(id){
  S.custom=(S.custom||[]).filter(c=>c.en!==id);delete S.cards[id];delete S.fav[id];delete EX[id];
  for(const k in S.days){const d=S.days[k];if(d&&d.queue)["queue","remaining","isNew"].forEach(f=>{if(d[f])d[f]=d[f].filter(x=>x!==id)})}
  rebuild();save();
}
function setPri(id,p){const c=(S.custom||[]).find(c=>c.en===id);if(c){c.pri=p;rebuild();save()}}
function parseBulk(txt,pri){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
    const p=l.split(/\t|,|，/).map(s=>s.trim());let pos="他",i=1;const k=POSMAP[(p[1]||"").toLowerCase()];
    if(k&&p.length>=3){pos=k;i=2}
    return{en:p[0],pos,jp:p[i]||"",ex:p.slice(i+1).join(", "),pri}});
}

/* ===== 共通ユーティリティ ===== */
const pad=n=>String(n).padStart(2,"0");
const dkey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(k,n)=>{const[y,m,d]=k.split("-").map(Number);return dkey(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const[y1,m1,d1]=a.split("-").map(Number),[y2,m2,d2]=b.split("-").map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function lev(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function hl(en,s){const stem=en.length>6?en.slice(0,-3):en.slice(0,Math.max(3,en.length-2));
  return esc(s).replace(new RegExp("\\b("+stem+"\\w*)","i"),"<mark>$1</mark>")}

  sound:true,speak:true,auto:true,theme:"auto",fav:{},log:{},lastBackup:null,custom:[]}}
function load(){try{const r=localStorage.getItem(KEY);S=r?Object.assign(fresh(),JSON.parse(r)):fresh()}catch(e){S=fresh()}
  /* 古い日の出題データを削除して容量を節約 */
  for(const k of Object.keys(S.days)){if(diffDays(k,dkey())>40){delete S.days[k]}else if(diffDays(k,dkey())>3){const x=S.days[k];S.days[k]=x.frozen?{frozen:true}:{done:!!x.done}}}
  applyTheme();rebuild()}

let AC=null;
function beep(ok){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const t=AC.currentTime,seq=ok?[[784,0],[1175,.09]]:[[196,0],[165,.12]];
  seq.forEach(([f,dt])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"sine":"triangle";o.frequency.value=f;
    g.gain.setValueAtTime(.0001,t+dt);g.gain.exponentialRampToValueAtTime(.12,t+dt+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dt+.18);
    o.connect(g);g.connect(AC.destination);o.start(t+dt);o.stop(t+dt+.2)})}catch(e){}}
const canSpeak=()=>"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";

  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}

/* ===== 連続記録 ===== */
let T=dkey();
function checkStreak(){
  if(!S.lastDone||S.lastDone===T)return;
  const gap=diffDays(S.lastDone,T)-1;
  if(gap<=0)return;
  if(S.freezes>=gap){
    S.freezes-=gap;
    for(let i=1;i<=gap;i++)S.days[addDays(S.lastDone,i)]={frozen:true};
    S.lastDone=addDays(T,-1);
    S.notice=`サボった${gap}日分をフリーズで守りました。残りフリーズ ${S.freezes}個。次はありません。`;
  }else{
    S.notice=`連続${S.streak}日の記録が途切れました。ゼロから積み直しです。`;
    S.streak=0;S.lastDone=null;
  }
}
function today(){
  let d=S.days[T];
  if(d&&d.queue){d.intro=d.intro||{};d.missed=d.missed||{};return d}
  const due=Object.entries(S.cards).filter(([id,c])=>WMAP[id]&&c.due<=T).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([id])=>id).slice(0,20);
  const neu=WORDS.slice().sort((a,b)=>(b[3]||2)-(a[3]||2)).map(w=>w[0]).filter(id=>!S.cards[id]).slice(0,S.newPerDay);
  let q=[...due,...neu];
  if(!q.length)q=shuffle(Object.keys(S.cards)).slice(0,10);
  d=S.days[T]={queue:q,remaining:shuffle(q),firstTry:{},correct:0,answered:0,done:false,isNew:neu,intro:{},missed:{}};
  save();return d;
}
function rankOf(xp){let r=RANKS[0],n=null;for(let i=0;i<RANKS.length;i++){if(xp>=RANKS[i][0]){r=RANKS[i];n=RANKS[i+1]||null}}return{name:r[1],from:r[0],next:n}}
const weakIds=()=>Object.entries(S.cards).filter(([,c])=>(c.miss||0)>=1&&c.box<=2).sort((a,b)=>(b[1].miss||0)-(a[1].miss||0)).map(([id])=>id);
function status(id){const c=S.cards[id];if(!c)return"new";if(c.box>=4)return"mas";if((c.miss||0)>=1&&c.box<=2)return"weak";return"learn"}

  document.getElementById("go").onclick=()=>{S.notice="";startQuiz(d.done?"extra":"daily")};
  const wb=document.getElementById("weak");if(wb)wb.onclick=()=>startQuiz("weak");

function tick(){
  const el=document.getElementById("clock");if(!el){clearInterval(timer);return}
  const now=new Date();if(dkey(now)!==T){T=dkey(now);checkStreak();save();home();return}
  const end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const s=Math.floor((end-now)/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  el.textContent=`${pad(h)}:${pad(m)}:${pad(sec)}`;
  const d=S.days[T],dl=document.getElementById("dl"),msg=document.getElementById("dlMsg"),lab=document.getElementById("dlLabel");
  dl.classList.remove("urgent","cleared");
  if(d&&d.done){dl.classList.add("cleared");lab.textContent="本日分 完了";msg.textContent="今日の判子は押されました。明日の締切まで";return}
  const started=d&&d.answered>0;
  if(h<2){dl.classList.add("urgent");msg.textContent="あと2時間を切りました。今すぐ。"}
  else if(h<6)msg.textContent="締切まで6時間を切りました。";
  else msg.textContent=started?"途中です。最後までやり切りましょう。":"今日の10語、まだ手つかずです。";
}

/* ===== 単語帳 ===== */
let bookF="all",bookQ="";const openW=new Set();
const BF=[["all","すべて"],["fav","★"],["weak","苦手"],["learn","学習中"],["mas","定着"],["new","未学習"],["cus","追加語"]];
function book(){
  view="book";clearInterval(timer);
  setApp(`<div class="top"><div class="brand">単語帳<small>${WORDS.length}語 / タップで例文</small></div></div>
  <input type="search" class="search" id="bq" placeholder="英単語・日本語で検索" value="${esc(bookQ)}" aria-label="検索">
  <div id="addbox"></div><div class="chips" id="bf"></div><div id="blist"></div>`,"book");
  document.getElementById("bq").oninput=e=>{bookQ=e.target.value;bookList()};
  addBox();
  bookList();
}
function bookList(){
  const q=bookQ.trim().toLowerCase();
  const list=WORDS.filter(w=>{const id=w[0],st=status(id);
    if(bookF==="fav"&&!S.fav[id])return false;
    if(bookF==="cus"){if(!WMAP[id].custom)return false}
    else if(bookF!=="all"&&bookF!=="fav"&&st!==bookF)return false;
    return !q||id.includes(q)||w[2].includes(q)});
  document.getElementById("bf").innerHTML=BF.map(([k,t])=>`<button data-f="${k}" class="${k===bookF?"on":""}">${t}</button>`).join("");
  document.getElementById("blist").innerHTML=list.length?list.map(w=>{const id=w[0],st=status(id),c=S.cards[id],open=openW.has(id);
    return `<div class="wi ${st}" data-w="${id}"><div class="wi-h"><span class="dot" title="${{new:"未学習",learn:"学習中",mas:"定着",weak:"苦手"}[st]}"></span><b>${id}</b><span class="bdg">${PRI[WMAP[id].pri]}</span><span class="jp">${esc(w[2])}</span><button class="star ${S.fav[id]?"on":""}" data-star="${id}" aria-label="お気に入り">★</button></div>
    ${open?reveal(WMAP[id])+(c?`<div style="font-size:12px;color:var(--muted);margin-top:6px">出題 ${c.seen||0}回 / 一発ミス ${c.miss||0}回 / 次回 ${c.due}</div>`:"")+(WMAP[id].custom?ctl(id):""):""}</div>`}).join(""):`<div class="empty">該当する単語がありません</div>`;
}
function reveal(w){return `<div class="rv"><div class="rv-h"><b>${esc(w.en)}</b><span class="ps">${POS[w.pos]}</span>${spkBtn(w.en)}</div><div class="rv-jp">${esc(w.jp)}</div>${EX[w.en]?`<div class="rv-ex">${hl(w.en,EX[w.en])}</div>`:""}</div>`}

  </section>

  <p class="foot">準1級 単語道場 v2 / 全${WORDS.length}語</p>`,"set");
  document.getElementById("npd").onchange=e=>{S.newPerDay=+e.target.value;save()};
  document.getElementById("theme").onchange=e=>{S.theme=e.target.value;applyTheme();save()};
  document.getElementById("exam").onchange=e=>{S.exam=e.target.value;save()};
  app.querySelectorAll(".sw").forEach(c=>c.onchange=()=>{S[c.dataset.k]=c.checked;save();if(c.dataset.k==="sound"&&c.checked)beep(true);if(c.dataset.k==="speak"&&c.checked)say("Hello",true)});
  document.getElementById("exp").onclick=()=>{
    const b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");
    a.href=URL.createObjectURL(b);a.download=`tango-dojo-backup-${T}.json`;document.body.appendChild(a);a.click();a.remove();

      catch(e){alert("読み込めませんでした。tango-dojo-backup で始まるJSONファイルを選んでください。")}};

/* ===== クイズ ===== */
function startQuiz(kind){
  view="quiz";combo=0;wrongRun=0;clearInterval(timer);kindNow=kind;rank0=rankOf(S.xp).name;
  if(kind==="daily")sess=today();
  else{const ids=(kind==="weak"?weakIds():shuffle(Object.keys(S.cards))).slice(0,10);
    sess={queue:ids,remaining:shuffle(ids),firstTry:{},correct:0,answered:0,intro:{},missed:{}}}
  sess.intro=sess.intro||{};sess.missed=sess.missed||{};
  if(!sess.remaining.length){S.notice="出題できる語がまだありません。";return home()}
  next();
}
function pickType(id){
  const c=S.cards[id],box=c?c.box:0,r=Math.random(),L=canSpeak();
  if(!c||sess.missed[id])return "en2jp";
  if(box>=3)return r<.4?"spell":(r<.6&&L?"listen":"jp2en");
  if(box>=1)return r<.35?"jp2en":(r<.6&&L?"listen":"en2jp");
  return r<.6?"en2jp":"jp2en";
}
function distract(id,sim){
  let c=WORDS.filter(x=>x[0]!==id&&x[1]===WMAP[id].pos).map(x=>x[0]);
  if(sim)c.sort((a,b)=>lev(a,id)-lev(b,id)),c=c.slice(0,9);
  c=shuffle(c).slice(0,3);
  if(c.length<3)c=c.concat(shuffle(WORDS.map(x=>x[0]).filter(x=>x!==id&&!c.includes(x))).slice(0,3-c.length));
  return c;
}
const qhead=d=>{const total=d.queue.length,done=Math.max(0,total-d.remaining.length);
  return `<div class="qhead"><button class="x" id="quit">✕ 中断</button><div class="bar"><i style="width:${total?done/total*100:0}%"></i></div><span class="cnt">残り${d.remaining.length}</span></div>`};

function intro(id){
  const d=sess,w=WMAP[id];view="quiz";locked=true;
  setApp(`${qhead(d)}
  <div class="card intro">
    <span class="tag new">NEW 新出語</span>
    <div class="pos">${POS[w.pos]}</div>
    <div class="word">${esc(w.en)}</div>
    <div>${spkBtn(w.en)}</div>
    <div class="jpbig">${esc(w.jp)}</div>
    ${EX[id]?`<div class="rv-ex">${hl(id,EX[id])}</div>`:""}
  </div>
  <button class="btn" id="ok">覚えた(あとで確認テスト)</button>
  <div class="coach sm idle">${owl("normal")}<div class="bubble">${pick(LINES.teach)}</div></div>`);
  document.getElementById("quit").onclick=()=>home();
  const ok=document.getElementById("ok");ok.focus({preventScroll:true});
  ok.onclick=()=>{d.intro[id]=true;d.remaining.shift();d.remaining.splice(Math.min(4,d.remaining.length),0,id);save();next()};
  typeBubbles();setTimeout(()=>say(w.en),250);
}

function next(){
  if(dkey()!==T){T=dkey();checkStreak();save();return home()}
  const d=sess;clearTimeout(adv);
  if(!d.remaining.length)return finish();
  const id=d.remaining[0],w=WMAP[id];
  if(!S.cards[id]&&!d.intro[id])return intro(id);
  const type=pickType(id);cur={id,type};locked=false;view="quiz";
  const isNew=!S.cards[id];
  const tagTxt=isNew?"NEW":({spell:"スペル",listen:"リスニング"}[type]||"復習");
  let body,opts="";
  if(type==="en2jp"){body=`<div class="word">${esc(w.en)}</div><div class="hint">意味は?</div>`;
    opts=shuffle([id,...distract(id,false)]).map(o=>[o,WMAP[o].jp])}
  else if(type==="jp2en"){body=`<div class="word jp">${esc(w.jp)}</div><div class="hint">英語は?</div>`;
    opts=shuffle([id,...distract(id,true)]).map(o=>[o,WMAP[o].en])}
  else if(type==="listen"){body=`${spkBtn(w.en,"big")}<div class="hint">聞こえた単語は?</div>`;
    opts=shuffle([id,...distract(id,true)]).map(o=>[o,WMAP[o].en])}
  else{body=`<div class="word jp">${esc(w.jp)}</div><div class="pattern">${w.en[0]} ${"_ ".repeat(w.en.length-1).trim()}</div><div class="hint">${w.en.length}文字 / 英語を入力</div>`}
  setApp(`${qhead(d)}
  <div class="card">
    <span class="tag ${isNew?"new":""}">${tagTxt}</span>
    <span class="combo" id="combo">${combo>=2?combo+" COMBO":""}</span>
    <div class="pos">${POS[w.pos]}</div>
    ${body}
  </div>
  ${type==="spell"
    ?`<form class="spellbox" id="sf" autocomplete="off"><input id="sp" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" aria-label="英語で答える" placeholder="スペルを入力"><button class="btn" type="submit">決定</button></form>`
    :`<div class="opts">${opts.map(([o,t],i)=>`<button class="opt" data-id="${o}"><span class="k">${i+1}</span><span>${esc(t)}</span></button>`).join("")}</div>`}
  <button class="btn ghost dk" id="dk">わからない</button>
  <div class="fb" id="fb"></div>
  <div id="rv"></div>
  <div class="coach sm idle" id="coach">${owl("think")}<div class="bubble">${askLine(type)}</div></div>
  <div id="nx"></div>`);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b.dataset.id));
  document.getElementById("quit").onclick=()=>{locked=true;home()};
  document.getElementById("dk").onclick=()=>settle(false,{dunno:true});
  if(type==="spell"){const inp=document.getElementById("sp");inp.focus();
    document.getElementById("sf").onsubmit=e=>{e.preventDefault();const v=inp.value.trim().toLowerCase();if(!v)return;
      if(v===id)settle(true);else settle(false,{near:lev(v,id)<=1,typed:v})}}
  if(type==="listen")setTimeout(()=>say(w.en,true),300);startHint(type);
  typeBubbles();
}
function answer(choice){
  if(locked)return;
  const id=cur.id,ok=choice===id;
  app.querySelectorAll(".opt").forEach(b=>{if(b.dataset.id===id)b.classList.add("right");else if(b.dataset.id===choice)b.classList.add("wrong")});
  settle(ok,{});
}
function record(id,ok){
  const d=sess,c=S.cards[id]||{box:0,due:T,miss:0,seen:0};
  const L=S.log[T]||(S.log[T]={n:0,ok:0});
  if(!(id in d.firstTry)){
    d.firstTry[id]=ok;c.seen=(c.seen||0)+1;if(!ok)c.miss=(c.miss||0)+1;
    L.n++;if(ok)L.ok++;
    if(kindNow==="daily"){c.box=ok?Math.min(c.box+1,5):0;c.due=addDays(T,INTERVAL[c.box])}
    else if(!ok){c.box=0;c.due=addDays(T,1)}
    S.cards[id]=c;
  }
}
function settle(ok,o){
  if(locked)return;locked=true;
  const d=sess,id=cur.id,w=WMAP[id];
  record(id,ok);d.answered++;
  let gain=0;
  if(ok){combo++;gain=10+Math.min(combo,10)*2+(cur.type==="spell"?8:0);S.xp+=gain;d.correct++;d.remaining.shift()}
  else{combo=0;d.missed[id]=true;d.remaining.shift();d.remaining.splice(Math.min(3,d.remaining.length),0,id)}
  beep(ok);if(!ok&&navigator.vibrate){try{navigator.vibrate(60)}catch(e){}}
  const fb=document.getElementById("fb"),co=document.getElementById("coach");
  co.className="coach sm "+(ok?"hop":"shake");
  const rc=react(ok,o,w);co.innerHTML=owl(rc.mood)+`<div class="bubble">${rc.text}</div>`;if(rc.mood==="wow")burst(co);
  typeBubbles();
  fb.className="fb "+(ok?"ok":"ng");
  if(ok)fb.textContent=`正解 +${gain} XP`;
  else fb.textContent=(o.near?"惜しい!あと1文字違います。":o.typed?`「${o.typed}」ではありません。`:o.dunno?"わからない語は、ここで覚えましょう。":"不正解。")+"あとでもう一度出ます。";
  if(ok&&combo>=2){const cb=document.getElementById("combo");cb.textContent=combo+" COMBO";cb.classList.remove("pop");void cb.offsetWidth;cb.classList.add("pop")}
  const dk=document.getElementById("dk");if(dk)dk.remove();
  const sf=document.getElementById("sf");if(sf){sf.querySelector("input").disabled=true;sf.querySelector("button").disabled=true}
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.id===id)b.classList.add("right")});
  document.getElementById("rv").innerHTML=reveal(w);
  document.getElementById("nx").innerHTML=`<button class="btn" id="nxt">次へ</button>`;
  const n=document.getElementById("nxt");n.onclick=next;n.focus({preventScroll:true});
  try{n.scrollIntoView({block:"nearest",behavior:RM?"auto":"smooth"})}catch(e){}
  if(cur.type!=="listen")say(w.en);
  save();
  if(ok&&S.auto)adv=setTimeout(next,2000);
}
function finish(){
  const d=sess,daily=kindNow==="daily";let first=false,bonusFreeze=false;
  if(daily&&!d.done){
    d.done=true;first=true;S.xp+=50;
    if(S.lastDone!==T){S.streak++;S.best=Math.max(S.best,S.streak);S.lastDone=T;
      if(S.streak%7===0&&S.freezes<3){S.freezes++;bonusFreeze=true}}
  }
  save();
  const firstOk=Object.values(d.firstTry).filter(Boolean).length,n=Object.keys(d.firstTry).length;
  const missed=Object.keys(d.missed||{}),rk1=rankOf(S.xp).name,up=rk1!==rank0;
  const title=daily?(first?`連続 ${S.streak}日目`:"本日分は完了済み"):(kindNow==="weak"?"苦手特訓 完了":"おかわり完了");
  setApp(`
  <div class="panel result">
    <div class="hanko">済</div>
    <div class="big">${title}</div>
    <div style="color:var(--muted)">${first?"今日の判子を押しました。+50 XP":daily?"":"記録は今日の分に含まれています"}</div>
    ${finCoach(n?firstOk/n:0,n,up,bonusFreeze,first)}
    ${up?`<div class="notice">昇段。「${rk1}」になりました。</div>`:""}
    ${bonusFreeze?`<div class="notice">7日連続達成。フリーズを1個獲得しました。</div>`:""}
    <div class="stats">
      <div><b>${n?Math.round(firstOk/n*100):0}%</b><span>一発正解率</span></div>
      <div><b>${d.answered}</b><span>解答数</span></div>
      <div><b>${S.xp}</b><span>累計XP</span></div>
    </div>
    ${missed.length?`<div class="misslist"><div class="label" style="margin-bottom:4px">つまずいた語(単語帳で復習できます)</div>${missed.map(id=>`<div><b>${esc(id)}</b> ${esc(WMAP[id].jp)}</div>`).join("")}</div>`:""}
  </div>
  <button class="btn" id="back">道場に戻る</button>`);
  document.getElementById("back").onclick=home;if(finWow)burst(document.querySelector(".hanko"));finWow=false;
  typeBubbles();
}

/* ===== イベント ===== */
app.addEventListener("click",e=>{
  const dl=e.target.closest("[data-del]");
  if(dl){const id=dl.dataset.del;if(confirm(`「${id}」を削除します。学習記録も消えます。よろしいですか?`)){delWord(id);openW.delete(id);addBox();bookList()}return}
  if(e.target.closest("[data-nopass]"))return;
  const ad=e.target.closest("[data-add]");if(ad){addMode=addMode===ad.dataset.add?null:ad.dataset.add;addMsg="";addBox();return}
  const gv=id=>document.getElementById(id).value;
  if(e.target.id==="a_ok"){const r=addWords([{en:gv("a_en"),pos:gv("a_pos"),jp:gv("a_jp"),ex:gv("a_ex"),pri:+gv("a_pri")}]);showAddMsg(resMsg(r),!r.ok);return}
  if(e.target.id==="b_ok"){const r=addWords(parseBulk(gv("b_txt"),+gv("b_pri")));showAddMsg(resMsg(r),!r.ok);return}
  const t=e.target.closest("[data-tab]");if(t){nav(t.dataset.tab);return}
  const sp=e.target.closest("[data-say]");if(sp){e.stopPropagation();say(sp.dataset.say,true);return}
  const st=e.target.closest("[data-star]");if(st){const id=st.dataset.star;if(S.fav[id])delete S.fav[id];else S.fav[id]=1;save();bookList();return}
  const bf=e.target.closest("[data-f]");if(bf){bookF=bf.dataset.f;bookList();return}
  const wi=e.target.closest("[data-w]");if(wi){const id=wi.dataset.w;if(openW.has(id))openW.delete(id);else openW.add(id);bookList();return}
  const bb=e.target.closest(".bubble");if(bb&&bb._typing){finishType(bb);return}
  const m=e.target.closest(".mascot")||(bb&&bb.parentElement.querySelector(".mascot"));if(!m)return;
  pokeMascot(m);
});
app.addEventListener("change",e=>{const s=e.target.closest("[data-pri]");if(s){setPri(s.dataset.pri,+s.value);bookList()}});
document.addEventListener("keydown",e=>{
  if(view!=="quiz")return;
  const ae=document.activeElement,tag=ae&&ae.tagName;
  if(/^[1-4]$/.test(e.key)&&!locked&&tag!=="INPUT"){const b=app.querySelectorAll(".opt")[+e.key-1];if(b)b.click()}
  else if((e.key==="Enter"||e.key===" ")&&locked&&tag!=="BUTTON"){const n=document.getElementById("nxt");if(n){e.preventDefault();n.click()}}
});
load();checkStreak();save();home();
</script>
